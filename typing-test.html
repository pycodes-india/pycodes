<script>
  document.addEventListener('contextmenu', event => event.preventDefault());
  document.addEventListener('keydown', function(e) {
      if (e.keyCode == 123) return false;
      if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
      if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
      if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
      if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
  });
</script>

<style>
:root{
--tm-header:#172554;--tm-header-light:#2563eb;--tm-bg:#f4f7fb;--tm-panel:#fff;
--tm-border:#dbe3ef;--tm-text:#172033;--tm-text-dim:#64748b;--tm-accent:#f59e0b;

}

<body class="h-screen overflow-hidden flex flex-col">

<div id="app" class="flex flex-col h-full w-full overflow-hidden">
  
  <!-- Typing Master Style Header -->
  <header class="flex-shrink-0 z-30 shadow-md" style="background: linear-gradient(90deg, var(--tm-header) 0%, var(--tm-header-light) 100%);">
    <div class="max-w-[1200px] mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
       
        <div class="text-white">
          <h1 class="text-xl font-semibold tracking-wide leading-tight text-shadow">TypingWorld</h1>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="soundToggle" class="tm-btn !px-3 !py-1 flex items-center justify-center" title="Toggle Sound"></button>
        <button id="resetBtn" class="tm-btn !px-3 !py-1 flex items-center justify-center text-red-600" title="Reset Progress">
          <i class="fa-solid fa-rotate-left mr-1"></i> Reset
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="max-w-[1200px] mx-auto px-4 py-6 flex flex-col w-full flex-1 min-h-0 overflow-hidden">
    
    <!-- White Window Container -->
    <div class="tm-window flex flex-col flex-1 min-h-0 rounded-md">
      
      <!-- Top Stats Bar -->
      <div class="bg-gray-100 border-b border-[var(--tm-border)] p-3 px-6 flex justify-between items-center text-sm">
        <div class="text-[var(--tm-text-dim)] font-semibold flex items-center gap-2">
           <i class="fa-solid fa-user-graduate text-[var(--tm-blue)]"></i> User Status
        </div>
        <div class="flex gap-6 font-semibold" id="topStatsBar">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Dynamic Content Area (Dashboard OR Chapter Detail) -->
      <main class="flex-1 min-w-0 flex flex-col overflow-y-auto p-6" id="mainPanel">
          <div class="p-10 text-center flex flex-col items-center justify-center h-full text-[var(--tm-text-dim)]">
              <i class="fa-solid fa-hourglass-half fa-spin text-4xl mb-4"></i>
              <h2 class="text-xl">Loading Data...</h2>
          </div>
      </main>

    </div>
  </div>

  <footer class="flex-shrink-0 py-2 bg-[var(--tm-header)] text-center text-xs text-white/80 border-t border-white/10">
    <a href="https://pycodes.in" class="hover:text-white transition-colors">TypingWorld by PyCodes</a> &copy; 2026
  </footer>

</div>

<script>
(function(){
  'use strict';

  var SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTTpRaHoIqCMFwkZVjprUwo1Do032kP6Nx7R0ILNZm3Lkb_MpWceUoIqv-6ciuTxJn86sY2-huuYMXn/pub?output=csv';

  var CHAPTERS = [];
  var STORAGE_KEY = 'TypingWorld_TM_v1';
  var state = loadState();
  var currentView = 'dashboard'; // 'dashboard' | 'chapter'
  var selectedChapterId = null;
  var activePopup = null;
  var popupWatcherInterval = null;

  function defaultState(){
    return { settings:{ soundEnabled:true, timerDuration:60 }, completed:{}, history:[] };
  }
  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        var d = defaultState();
        return { settings: Object.assign(d.settings, parsed.settings || {}), completed: parsed.completed || {}, history: parsed.history || [] };
      }
    }catch(e){}
    return defaultState();
  }
  function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; });
  }

  function isUnlocked(id){ return id===1 || !!state.completed[id-1]; }
  function wordCount(text){ return text.trim().split(/\s+/).length; }

  function applySoundIcon(){
    var btn = document.getElementById('soundToggle');
    btn.innerHTML = state.settings.soundEnabled 
      ? '<i class="fa-solid fa-volume-high text-green-600 mr-1"></i> Sound On' 
      : '<i class="fa-solid fa-volume-xmark text-gray-500 mr-1"></i> Muted';
  }

  function renderTopStats(){
    var completedCount = Object.keys(state.completed).length;
    var allWpm = state.history.map(function(h){ return h.wpm; });
    var bestWpm = allWpm.length ? Math.max.apply(null, allWpm) : 0;
    var avgAcc = state.history.length ? Math.round(state.history.reduce(function(a,h){ return a+h.accuracy; },0) / state.history.length) : 0;
    
    document.getElementById('topStatsBar').innerHTML = 
      '<div class="flex items-center gap-1"><span class="text-gray-500 font-normal">Completed:</span> <span class="text-[var(--tm-blue)]">'+completedCount+'/'+Math.max(1, CHAPTERS.length)+'</span></div>' +
      '<div class="flex items-center gap-1"><span class="text-gray-500 font-normal">Top Speed:</span> <span class="text-[var(--tm-green)]">'+bestWpm+' WPM</span></div>' +
      '<div class="flex items-center gap-1"><span class="text-gray-500 font-normal">Avg Accuracy:</span> <span class="text-[var(--tm-accent)]">'+avgAcc+'%</span></div>';
  }

  // ================= VIEW MANAGER =================
  function renderApp() {
    renderTopStats();
    if(currentView === 'dashboard') {
      renderDashboard();
    } else if (currentView === 'chapter' && selectedChapterId) {
      renderChapterDetail();
    }
  }

  // ================= 1. DASHBOARD VIEW =================
  function renderDashboard(){
    var html = '';
    html += '<div class="flex justify-between items-end mb-4">';
    html += '<div><h2 class="text-2xl font-semibold text-[var(--tm-blue)]">Typing Courses & Drills</h2><p class="text-sm text-[var(--tm-text-dim)]">Select a chapter below to begin your training session.</p></div>';
    html += '</div>';

    html += '<div class="border border-[var(--tm-border)] bg-white rounded flex-1 flex flex-col min-h-0">';
    
    // Table Header
    html += '<div class="flex bg-[#F0F4F8] border-b border-[var(--tm-border)] p-3 text-sm font-semibold text-[var(--tm-text-dim)]">';
    html += '<div class="w-12 text-center">Status</div>';
    html += '<div class="flex-1">Chapter Name</div>';
    html += '<div class="w-32 text-center">Best WPM</div>';
    html += '<div class="w-32 text-center">Accuracy</div>';
    html += '<div class="w-24 text-center">Action</div>';
    html += '</div>';

    // Table Body (Scrollable)
    html += '<div class="overflow-y-auto flex-1">';
    
    CHAPTERS.forEach(function(c){
      var unlocked = isUnlocked(c.id);
      var done = state.completed[c.id];
      
      var icon = !unlocked ? '<i class="fa-solid fa-lock text-gray-400"></i>' : (done ? '<i class="fa-solid fa-check text-[var(--tm-green)]"></i>' : '<i class="fa-solid fa-star text-[var(--tm-accent)]"></i>');
      var wpmText = done ? done.bestWpm + ' WPM' : '-';
      var accText = done ? done.bestAccuracy + '%' : '-';

      html += '<div class="flex items-center p-3 text-sm tm-row '+(unlocked ? '' : 'opacity-60 bg-gray-50')+'">';
      html += '<div class="w-12 text-center text-lg">'+icon+'</div>';
      html += '<div class="flex-1 font-semibold text-[var(--tm-text)]">'+c.id+'. '+escapeHtml(c.title)+'</div>';
      html += '<div class="w-32 text-center text-[var(--tm-text-dim)]">'+wpmText+'</div>';
      html += '<div class="w-32 text-center text-[var(--tm-text-dim)]">'+accText+'</div>';
      html += '<div class="w-24 text-center">';
      if(unlocked){
        html += '<button onclick="window.selectChapter('+c.id+')" class="tm-btn-primary w-full py-1 text-xs">Start <i class="fa-solid fa-caret-right ml-1"></i></button>';
      } else {
        html += '<button disabled class="tm-btn w-full py-1 text-xs text-gray-500">Locked</button>';
      }
      html += '</div>';
      html += '</div>';
    });
    
    html += '</div></div>';
    
    document.getElementById('mainPanel').innerHTML = html;
  }

  // Global function for onclick
  window.selectChapter = function(id) {
    selectedChapterId = id;
    currentView = 'chapter';
    renderApp();
  };

  // ================= 2. CHAPTER DETAIL VIEW =================
  function renderChapterDetail(){
    var c = CHAPTERS.find(function(x){ return x.id===selectedChapterId; });
    if(!c) { currentView = 'dashboard'; renderApp(); return; }
    var done = state.completed[c.id];

    var html = '';
    
    // Back Button & Header
    html += '<div class="flex items-center gap-4 mb-4 pb-4 border-b border-[var(--tm-border)]">';
    html += '<button onclick="window.goBack()" class="tm-btn text-sm"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Courses</button>';
    html += '<div><h2 class="text-xl font-bold text-[var(--tm-blue)]">'+c.id+'. '+escapeHtml(c.title)+'</h2><p class="text-xs text-[var(--tm-text-dim)]">Practice Drill Setup</p></div>';
    html += '</div>';

    html += '<div class="flex gap-6 h-full min-h-0">';
    
    // Left Column: Drill Preview & Run
    html += '<div class="flex-1 flex flex-col gap-4 min-w-0">';
      
      // Text Preview Box
      html += '<div class="tm-card flex flex-col h-[200px] shadow-sm">';
      html += '<div class="bg-[var(--tm-header)] text-white px-3 py-1.5 text-sm font-semibold rounded-t flex justify-between"><span class="tracking-wide">Text Preview</span> <span class="font-normal opacity-80">'+wordCount(c.text)+' words</span></div>';
      html += '<div class="p-4 font-mono text-[15px] leading-relaxed text-[var(--tm-text-dim)] overflow-y-auto bg-white flex-1 rounded-b select-none">';
      html += escapeHtml(c.text);
      html += '</div></div>';
      
      // Settings Box
      html += '<div class="tm-card p-4 shadow-sm">';
      html += '<div class="text-sm font-bold text-[var(--tm-text)] mb-3">Duration Setup</div>';
      html += '<div class="flex flex-wrap gap-2 mb-4">';
      [30, 60, 120, 'sudden'].forEach(function(d){
        var active = state.settings.timerDuration === d;
        var label = d==='sudden' ? '<i class="fa-solid fa-skull mr-1"></i> Sudden Death' : d+' Seconds';
        html += '<button onclick="window.setDuration(\''+d+'\')" class="tm-btn timer-btn px-4 py-1.5 text-sm '+(active?'active':'')+'">'+label+'</button>';
      });
      html += '</div>';
      html += '<div class="border-t border-[var(--tm-border)] pt-4 mt-2">';
      html += '<button onclick="window.startCurrentDrill()" class="tm-btn-primary px-8 py-3 text-lg font-bold shadow-md"><i class="fa-solid fa-play-circle mr-2"></i> Begin Drill</button>';
      html += '</div>';
      html += '</div>';

    html += '</div>'; // End Left Col

    // Right Column: Stats & Recent Runs
    html += '<div class="w-[300px] flex flex-col gap-4 flex-shrink-0">';
      
      // Best Stats Card
      if(done){
        html += '<div class="tm-card shadow-sm">';
        html += '<div class="bg-[#F0F4F8] border-b border-[var(--tm-border)] px-3 py-2 text-sm font-bold text-[var(--tm-text)]">Your Best Performance</div>';
        html += '<div class="p-3 grid grid-cols-2 gap-2 text-center">';
        html += '<div class="border border-[var(--tm-border)] bg-white p-2 rounded"><div class="text-lg font-bold text-[var(--tm-blue)]">'+done.bestWpm+'</div><div class="text-[10px] uppercase text-gray-500">WPM</div></div>';
        html += '<div class="border border-[var(--tm-border)] bg-white p-2 rounded"><div class="text-lg font-bold text-[var(--tm-green)]">'+done.bestAccuracy+'%</div><div class="text-[10px] uppercase text-gray-500">Accuracy</div></div>';
        html += '</div></div>';
      }

      // Recent History for this chapter (or global)
      html += '<div class="tm-card shadow-sm flex flex-col flex-1 min-h-0">';
      html += '<div class="bg-[#F0F4F8] border-b border-[var(--tm-border)] px-3 py-2 text-sm font-bold text-[var(--tm-text)]">Recent Runs</div>';
      html += '<div class="p-2 overflow-y-auto flex-1">';
      
      var recent = state.history.filter(function(h){ return h.chapterId === c.id; }).slice(-6).reverse();
      if(recent.length === 0){
        html += '<div class="text-center text-gray-400 text-sm mt-4 italic">No attempts yet.</div>';
      } else {
        recent.forEach(function(h){
          var date = new Date(h.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
          html += '<div class="mb-2 pb-2 border-b border-gray-200 last:border-0">';
          html += '<div class="flex justify-between text-xs text-gray-500 mb-1"><span>'+date+'</span> <span class="'+(h.completed?'text-[var(--tm-green)]':'text-[var(--tm-red)]')+'">'+(h.completed?'Completed':'Failed')+'</span></div>';
          html += '<div class="flex justify-between font-mono text-sm"><span>Speed: <b class="text-[var(--tm-blue)]">'+h.wpm+'</b> wpm</span> <span>Acc: <b class="text-[var(--tm-green)]">'+h.accuracy+'%</b></span></div>';
          html += '</div>';
        });
      }

      html += '</div></div>';

    html += '</div>'; // End Right Col
    html += '</div>'; // End Flex Row

    document.getElementById('mainPanel').innerHTML = html;
  }

  window.goBack = function() {
    currentView = 'dashboard';
    selectedChapterId = null;
    renderApp();
  };

  window.setDuration = function(val) {
    state.settings.timerDuration = (val==='sudden') ? 'sudden' : parseInt(val,10);
    saveState();
    renderApp();
  };

  window.startCurrentDrill = function() {
    openTypingSession(selectedChapterId);
  };

  /* ===================== Popup Session Logic (Themed for TM10) ===================== */
  var POPUP_CSS = ':root{--tm-header:#172554;--tm-bg:#f1f5f9;--tm-panel:#fff;--tm-border:#dbe4ef;--tm-text:#172033;--tm-blue:#2563eb;--tm-green:#16a34a;--tm-red:#dc2626;--tm-accent:#f59e0b;}*{box-sizing:border-box;margin:0;padding:0;}html,body{height:100%;}body{background:radial-gradient(circle at 10% 0%,rgba(37,99,235,.10),transparent 28%),linear-gradient(180deg,#f8faff,#eef3f8);color:var(--tm-text);font-family:"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;}.font-mono{font-family:"Consolas",monospace;}#root{flex:1;display:flex;flex-direction:column;height:100%;padding:18px;}.wrap{flex:1;display:flex;flex-direction:column;background:rgba(255,255,255,.97);border:1px solid var(--tm-border);border-radius:16px;box-shadow:0 18px 45px rgba(15,23,42,.13);max-width:1120px;margin:0 auto;width:100%;overflow:hidden;}.topbar{background:linear-gradient(135deg,#111d49,#173b83 48%,#2563eb);color:white;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;}.chapter-name{font-size:20px;font-weight:750;letter-spacing:-.02em;}.mode-badge{font-size:12px;padding:6px 12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;}.stats-row{display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(180deg,#fff,#f7f9fc);border-bottom:1px solid var(--tm-border);}.stat{padding:14px;text-align:center;border-right:1px solid var(--tm-border);}.stat:last-child{border-right:none;}.stat-val{font-size:28px;font-weight:800;font-family:"Consolas",monospace;color:var(--tm-blue);}.stat-label{font-size:10px;color:#64748b;margin-top:4px;text-transform:uppercase;font-weight:750;letter-spacing:.08em;}.text-stage{flex:1;padding:34px;font-size:26px;line-height:1.65;white-space:pre-wrap;word-break:break-word;overflow-y:auto;font-family:"Consolas",monospace;background:linear-gradient(180deg,#fff,#fbfdff);}.text-stage span.pending{color:#94a3b8;}.text-stage span.correct{color:#0f172a;font-weight:bold;background:#e8f1ff;border-radius:2px;}.text-stage span.incorrect{color:#fff;background:var(--tm-red);border-radius:2px;}.text-stage span.current{border-bottom:3px solid var(--tm-blue);background:#fff4bd;color:#111827;}.hint{text-align:center;font-size:12px;color:#64748b;padding:10px;background:#f8fafc;border-top:1px solid var(--tm-border);}.hidden-input{position:absolute;opacity:0;height:1px;width:1px;pointer-events:none;}.summary-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;gap:20px;text-align:center;overflow-y:auto;background:radial-gradient(circle at 50% 0%,rgba(37,99,235,.08),transparent 35%),#fff;}.summary-title{font-size:36px;font-weight:800;letter-spacing:-.03em;}.summary-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:100%;max-width:720px;margin-top:16px;}.stat-box{border:1px solid var(--tm-border);padding:20px;background:linear-gradient(145deg,#fff,#f6f9fc);border-radius:12px;box-shadow:0 5px 16px rgba(15,23,42,.06);}.btn-row{display:flex;gap:12px;margin-top:22px;}.btn{padding:10px 24px;font-size:14px;font-weight:700;border-radius:9px;cursor:pointer;border:1px solid #cbd5e1;background:linear-gradient(180deg,#fff,#eef2f7);color:#334155;box-shadow:0 3px 8px rgba(15,23,42,.06);}.btn-accent{background:linear-gradient(135deg,#172554,#2563eb,#06b6d4);color:white;border-color:#1d4ed8;box-shadow:0 7px 18px rgba(37,99,235,.22);}@media(max-width:700px){#root{padding:8px}.stats-row{grid-template-columns:repeat(2,1fr)}.stat{border-bottom:1px solid var(--tm-border)}.text-stage{padding:20px;font-size:20px}.summary-stats{grid-template-columns:repeat(2,1fr)}.summary-title{font-size:27px}.btn-row{flex-direction:column;width:100%;max-width:280px}.btn{width:100%;}}';
  function popupMain(CONFIG){
    var text = CONFIG.text; var duration = CONFIG.duration; var soundOn = CONFIG.soundEnabled; var chapterId = CONFIG.chapterId; var chapterTitle = CONFIG.chapterTitle;
    var typed = ''; var totalKeystrokes = 0; var errorCount = 0; var startTime = null; var ended = false; var timerInterval = null; var elapsedSeconds = 0; var timeLeft = (typeof duration === 'number') ? duration : 0; var wpmHistory = []; var audioCtx = null; var charSpans = null; var root = document.getElementById('root');

    function escapeChar(ch){ var map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}; return map[ch] || ch; }

    function buildCharSpans(){
      var html = ''; for(var i=0;i<text.length;i++){ html += '<span class="pending" data-i="'+i+'">'+escapeChar(text[i])+'</span>'; }
      var stage = document.getElementById('textStage'); stage.innerHTML = html; charSpans = stage.querySelectorAll('span');
    }

    function renderShell(){
      root.innerHTML = '<div class="wrap"><div class="topbar"><div class="chapter-name">'+chapterTitle+'</div><div class="mode-badge">'+(duration==='sudden' ? 'Sudden Death Mode' : duration+' Seconds')+'</div></div><div class="stats-row"><div class="stat"><div class="stat-val" id="statTime" style="color:var(--tm-accent);">'+(duration==='sudden'?'0s':duration+'s')+'</div><div class="stat-label">'+(duration==='sudden'?'Time':'Time Left')+'</div></div><div class="stat"><div class="stat-val" id="statWpm">0</div><div class="stat-label">WPM</div></div><div class="stat"><div class="stat-val" id="statNet">0</div><div class="stat-label">Net WPM</div></div><div class="stat"><div class="stat-val" id="statAcc" style="color:var(--tm-green);">100%</div><div class="stat-label">Accuracy</div></div><div class="stat"><div class="stat-val" id="statErr" style="color:var(--tm-red);">0</div><div class="stat-label">Errors</div></div></div><div class="text-stage" id="textStage" aria-live="polite"></div><div class="hint">Start typing to begin the drill &middot; Press [ESC] to Abort</div><input id="hiddenInput" class="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" /></div>';
      buildCharSpans(); if(charSpans.length){ charSpans[0].classList.add('current'); }
      var inp = document.getElementById('hiddenInput'); inp.value = ''; inp.addEventListener('input', onInput); inp.focus(); root.addEventListener('click', function(){ if(!ended) inp.focus(); });
    }

    function renderChars(){
      for(var i=0;i<charSpans.length;i++){ var span = charSpans[i]; if(i < typed.length){ span.className = (typed[i]===text[i]) ? 'correct' : 'incorrect'; } else { span.className = 'pending'; } }
      if(typed.length < charSpans.length){ charSpans[typed.length].classList.add('current'); }
    }

    function computeStats(){
      if(elapsedSeconds===0){ var acc0 = totalKeystrokes>0 ? Math.round(((totalKeystrokes-errorCount)/totalKeystrokes)*100) : 100; return {wpm:0, net:0, acc:acc0}; }
      var mins = elapsedSeconds/60; var wpm = Math.max(0, Math.round((typed.length/5)/mins)); var net = Math.max(0, Math.round(((typed.length/5)-errorCount)/mins)); var acc = totalKeystrokes>0 ? Math.round(((totalKeystrokes-errorCount)/totalKeystrokes)*100) : 100; return {wpm:wpm, net:net, acc:acc};
    }

    function refreshStatsUI(){
      var s = computeStats(); document.getElementById('statWpm').textContent = s.wpm; document.getElementById('statNet').textContent = s.net; document.getElementById('statAcc').textContent = s.acc+'%'; document.getElementById('statErr').textContent = errorCount; document.getElementById('statTime').textContent = duration==='sudden' ? (elapsedSeconds+'s') : (timeLeft+'s');
    }

    function playClick(){ if(!soundOn) return; try{ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); var o = audioCtx.createOscillator(); var g = audioCtx.createGain(); o.type = 'sine'; o.frequency.value = 800; g.gain.setValueAtTime(0.06, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.04); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.04); }catch(e){} }
    function playError(){ if(!soundOn) return; try{ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); var o = audioCtx.createOscillator(); var g = audioCtx.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(250, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime+0.2); g.gain.setValueAtTime(0.12, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.2); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.2); }catch(e){} }

    function sendLiveUpdate(){ try{ if(window.opener && !window.opener.closed && window.opener.__typingApp){ var s = computeStats(); window.opener.__typingApp.receiveLiveUpdate({ chapterId: chapterId, wpm: s.wpm, accuracy: s.acc, errors: errorCount, timeLeft: (duration==='sudden' ? null : timeLeft), elapsed: elapsedSeconds }); } }catch(e){} }

    function startTimer(){ timerInterval = setInterval(function(){ if(ended) return; elapsedSeconds++; if(duration!=='sudden'){ timeLeft = duration - elapsedSeconds; if(timeLeft<=0){ timeLeft = 0; refreshStatsUI(); wpmHistory.push({t:elapsedSeconds, wpm:computeStats().wpm}); endSession(typed.length>=text.length); return; } } refreshStatsUI(); wpmHistory.push({t:elapsedSeconds, wpm:computeStats().wpm}); sendLiveUpdate(); }, 1000); }

    function onInput(){
      if(ended) return; var inp = document.getElementById('hiddenInput'); var newVal = inp.value; if(newVal.length > text.length) newVal = newVal.slice(0, text.length); if(startTime===null && newVal.length>0){ startTime = Date.now(); startTimer(); }
      if(newVal.length > typed.length){ for(var i=typed.length; i<newVal.length; i++){ totalKeystrokes++; var correct = newVal[i]===text[i]; if(correct){ playClick(); } else{ errorCount++; playError(); if(duration==='sudden'){ typed = newVal.slice(0,i+1); inp.value = typed; renderChars(); refreshStatsUI(); endSession(false); return; } } } }
      typed = newVal; inp.value = typed; renderChars(); refreshStatsUI(); if(typed.length >= text.length){ endSession(true); }
    }

    function endSession(completed){
      if(ended) return; ended = true; if(timerInterval) clearInterval(timerInterval); var s = computeStats(); var result = { chapterId: chapterId, chapterTitle: chapterTitle, wpm: s.wpm, netWpm: s.net, accuracy: s.acc, errors: errorCount, completed: completed, duration: Math.max(elapsedSeconds,1), mode: (duration==='sudden') ? 'sudden' : (duration+'s'), timestamp: Date.now() };
      try{ if(window.opener && !window.opener.closed && window.opener.__typingApp){ window.opener.__typingApp.receiveSessionResult(result); } }catch(e){} renderSummary(result);
    }

    function renderSummary(result){
      var success = result.completed; var titleText = success ? 'Exercise Completed Successfully' : (duration==='sudden' ? 'Sudden Death: Error Made' : "Time Expired");
      root.innerHTML = '<div class="wrap"><div class="topbar"><div>Exercise Results</div></div><div class="summary-wrap"><div style="font-size:60px; color:var('+(success?'--tm-green':'--tm-red')+');"><i class="fa-solid '+(success?'fa-award':'fa-triangle-exclamation')+'"></i></div><div class="summary-title" style="color:var('+(success?'--tm-blue':'--tm-red')+');">'+titleText+'</div><div class="summary-stats"><div class="stat-box"><div class="stat-val">'+result.wpm+'</div><div class="stat-label">Gross WPM</div></div><div class="stat-box"><div class="stat-val">'+result.netWpm+'</div><div class="stat-label">Net Speed</div></div><div class="stat-box"><div class="stat-val" style="color:var(--tm-green);">'+result.accuracy+'%</div><div class="stat-label">Accuracy</div></div><div class="stat-box"><div class="stat-val" style="color:var(--tm-red);">'+result.errors+'</div><div class="stat-label">Errors Made</div></div></div><div class="btn-row"><button id="retryBtn" class="btn">Restart Drill</button><button id="closeBtn" class="btn btn-accent">Return to Main Menu</button></div></div></div>';
      var fa = document.createElement('link'); fa.rel='stylesheet'; fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css'; document.head.appendChild(fa);
      document.getElementById('retryBtn').addEventListener('click', resetAndRestart); document.getElementById('closeBtn').addEventListener('click', function(){ window.close(); });
    }

    function resetAndRestart(){ typed=''; totalKeystrokes=0; errorCount=0; startTime=null; ended=false; elapsedSeconds=0; timeLeft=(typeof duration==='number')?duration:0; wpmHistory=[]; if(timerInterval) clearInterval(timerInterval); renderShell(); }
    document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(ended || confirm('Exit typing session? Progress will be lost.')){ window.close(); } } });
    renderShell();
  }

  function openTypingSession(chapterId){
    if(activePopup && !activePopup.closed){ activePopup.focus(); return; }
    var chapter = CHAPTERS.find(function(c){ return c.id===chapterId; });
    if(!chapter) return;

    var popup = window.open('', 'TypingWorld_TM_Session', 'width=1000,height=650,resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no');
    if(!popup){ alert('Please allow pop-ups to start the session.'); return; }

    var shellHtml = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>'+escapeHtml(chapter.title)+' - Typing Drill</title><style>'+POPUP_CSS+'</style></head><body><div id="root"></div></body></html>';
    popup.document.open(); popup.document.write(shellHtml); popup.document.close();

    var cfg = { chapterId: chapter.id, chapterTitle: chapter.title, text: chapter.text, duration: state.settings.timerDuration, soundEnabled: state.settings.soundEnabled };
    var scriptEl = popup.document.createElement('script');
    scriptEl.textContent = '(' + popupMain.toString() + ')(' + JSON.stringify(cfg) + ');';
    popup.document.body.appendChild(scriptEl);

    activePopup = popup;
    watchPopup();
  }

  function watchPopup(){
    if(popupWatcherInterval) clearInterval(popupWatcherInterval);
    popupWatcherInterval = setInterval(function(){
      if(activePopup && activePopup.closed){ clearInterval(popupWatcherInterval); activePopup = null; }
    }, 800);
  }

  window.__typingApp = {
    receiveLiveUpdate: function(data){ /* Could show live status if needed */ },
    receiveSessionResult: function(result){
      state.history.push(result);
      if(state.history.length>200) state.history = state.history.slice(-200);

      if(result.completed){
        var prev = state.completed[result.chapterId];
        state.completed[result.chapterId] = {
          bestWpm: prev ? Math.max(prev.bestWpm, result.wpm) : result.wpm,
          bestNet: prev ? Math.max(prev.bestNet, result.netWpm) : result.netWpm,
          bestAccuracy: prev ? Math.max(prev.bestAccuracy, result.accuracy) : result.accuracy,
          attempts: prev ? prev.attempts+1 : 1, completedAt: result.timestamp
        };
      }
      saveState(); 
      renderApp(); // Auto refresh UI behind the popup
    }
  };

  // ================= DATA FETCHING =================
  function loadChaptersFromSheet() {
    Papa.parse(SHEET_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        CHAPTERS = results.data.map(function(row) {
          return { id: parseInt(row.id, 10) || 0, title: row.title || 'Untitled', text: row.text || '' };
        });
        if (CHAPTERS.length > 0) {
          init();
        } else {
          document.getElementById('mainPanel').innerHTML = '<div class="p-10 text-center text-red-500 font-bold"><i class="fa-solid fa-triangle-exclamation text-3xl mb-4"></i><h2>No chapters found.</h2></div>';
        }
      },
      error: function(error) {
        document.getElementById('mainPanel').innerHTML = '<div class="p-10 text-center text-red-500 font-bold"><i class="fa-solid fa-triangle-exclamation text-3xl mb-4"></i><h2>Failed to load chapters. Check CSV link.</h2></div>';
      }
    });
  }

  function init(){
    applySoundIcon();
    renderApp();
    
    document.getElementById('soundToggle').addEventListener('click', function(){
      state.settings.soundEnabled = !state.settings.soundEnabled; saveState(); applySoundIcon();
    });
    
    document.getElementById('resetBtn').addEventListener('click', function(){
      if(confirm('Are you sure you want to reset all your progress and history?')){
        state = defaultState(); saveState(); currentView = 'dashboard'; renderApp();
      }
    });
  }

  loadChaptersFromSheet();

})();
</script>
