<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Typing Trainer | TypingWorld by PyCodes</title>
<meta name="description" content="Next-gen typing speed and accuracy trainer by PyCodes.">
<meta name="author" content="PyCodes">

<!-- Tailwind CSS & Fonts -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
  /* Protection Scripts */
  body { -webkit-user-select: none; -ms-user-select: none; user-select: none; }
</style>
<script>
  document.addEventListener('contextmenu', event => event.preventDefault());
  document.addEventListener('keydown', function(e) {
      if (e.keyCode == 123) return false;
      if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
      if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
      if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
      if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
  });
</script>

<style>
  /* ========================================== */
  /* ADVANCED DARK THEME VARIABLES              */
  /* ========================================== */
  :root {
    --bg-main: #020617; /* Very deep slate */
    --bg-panel: rgba(15, 23, 42, 0.65); /* Transparent slate for glassmorphism */
    --border-color: rgba(51, 65, 85, 0.5);
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --accent: #06B6D4; /* Cyan 500 */
    --accent-glow: rgba(6, 182, 212, 0.4);
    --success: #10B981;
    --danger: #EF4444;
  }
  
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-main);
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.08), transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08), transparent 25%);
    color: var(--text-main);
  }

  .font-mono { font-family: 'Fira Code', monospace; }

  /* Custom Scrollbar - Cyberpunk style */
  * { scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
  *::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* Glassmorphism Panels */
  .glass-panel {
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
  }

  /* Futuristic Buttons */
  .btn-advanced {
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 8px 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  .btn-advanced:hover:not(:disabled) {
    background: rgba(51, 65, 85, 0.9);
    border-color: var(--accent);
    box-shadow: 0 0 15px var(--accent-glow);
    transform: translateY(-1px);
  }
  .btn-advanced:active:not(:disabled) { transform: scale(0.97); }

  .btn-primary-glow {
    background: linear-gradient(135deg, #06B6D4 0%, #3B82F6 100%);
    color: #FFFFFF;
    border: none;
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
  }
  .btn-primary-glow:hover:not(:disabled) {
    box-shadow: 0 0 30px rgba(6, 182, 212, 0.6);
    transform: translateY(-2px);
  }
  .btn-primary-glow:disabled {
    background: #334155;
    color: #94A3B8;
    box-shadow: none;
    cursor: not-allowed;
  }

  .chapter-row { transition: all 0.2s; }
  .chapter-row:hover { background: rgba(51, 65, 85, 0.4); }
  
  .timer-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    box-shadow: 0 0 15px var(--accent-glow);
  }
</style>
</head>

<body class="h-screen overflow-hidden flex flex-col">

<div id="app" class="flex flex-col h-full w-full overflow-hidden relative">
  
  <!-- Advanced Header -->
  <header class="flex-shrink-0 z-30 border-b border-[var(--border-color)] glass-panel rounded-none">
    <div class="max-w-[1300px] mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 flex items-center justify-center text-white text-2xl rounded-xl" style="background: linear-gradient(135deg, var(--accent), #3B82F6); box-shadow: 0 0 20px var(--accent-glow);">
          <i class="fa-solid fa-code"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">TypingWorld</h1>
          <p class="text-[10px] text-cyan-300 font-mono tracking-widest uppercase">Platform by PyCodes</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button id="soundToggle" class="btn-advanced !px-4 !py-2 flex items-center gap-2" title="Toggle Sound"></button>
        <button id="resetBtn" class="btn-advanced !px-4 !py-2 flex items-center gap-2 text-red-400 hover:text-red-300 hover:!border-red-500" title="Factory Reset">
          <i class="fa-solid fa-power-off"></i> Reset Data
        </button>
      </div>
    </div>
  </header>

  <!-- Top Stats -->
  <div class="max-w-[1300px] mx-auto w-full px-6 py-4 flex-shrink-0">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="topStatsBar">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Main Container -->
  <div class="max-w-[1300px] mx-auto px-6 pb-6 flex flex-col w-full flex-1 min-h-0 overflow-hidden">
    <!-- Dynamic Area -->
    <main class="glass-panel flex-1 min-w-0 flex flex-col overflow-y-auto p-1 relative" id="mainPanel">
        <div class="p-10 text-center flex flex-col items-center justify-center h-full text-[var(--text-muted)]">
            <i class="fa-solid fa-circle-notch fa-spin text-5xl mb-6 text-cyan-500"></i>
            <h2 class="text-2xl font-mono text-white">Initializing Modules...</h2>
            <p class="mt-2 text-sm">Fetching chapters from secure database.</p>
        </div>
    </main>
  </div>

</div>

<script>
(function(){
  'use strict';

  var SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTTpRaHoIqCMFwkZVjprUwo1Do032kP6Nx7R0ILNZm3Lkb_MpWceUoIqv-6ciuTxJn86sY2-huuYMXn/pub?output=csv';

  var CHAPTERS = [];
  var STORAGE_KEY = 'TypingWorld_Advanced_v1';
  var state = loadState();
  var currentView = 'dashboard'; 
  var selectedChapterId = null;
  var activePopup = null;
  var popupWatcherInterval = null;

  function defaultState(){
    return { settings:{ soundEnabled:true, timerDuration:60 }, completed:{}, history:[] };
  }
  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ return { settings: Object.assign(defaultState().settings, JSON.parse(raw).settings || {}), completed: JSON.parse(raw).completed || {}, history: JSON.parse(raw).history || [] }; }
    }catch(e){} return defaultState();
  }
  function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

  function escapeHtml(str){ return String(str).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function isUnlocked(id){ return id===1 || !!state.completed[id-1]; }
  function wordCount(text){ return text.trim().split(/\s+/).length; }

  function applySoundIcon(){
    var btn = document.getElementById('soundToggle');
    btn.innerHTML = state.settings.soundEnabled 
      ? '<i class="fa-solid fa-volume-high text-cyan-400"></i> <span class="text-xs font-mono">SFX ON</span>' 
      : '<i class="fa-solid fa-volume-xmark text-slate-500"></i> <span class="text-xs font-mono">SFX OFF</span>';
  }

  function renderTopStats(){
    var completedCount = Object.keys(state.completed).length;
    var allWpm = state.history.map(function(h){ return h.wpm; });
    var bestWpm = allWpm.length ? Math.max.apply(null, allWpm) : 0;
    var avgAcc = state.history.length ? Math.round(state.history.reduce(function(a,h){ return a+h.accuracy; },0) / state.history.length) : 0;
    
    var stats = [
      { label: 'Modules Cleared', value: completedCount+'/'+Math.max(1, CHAPTERS.length), icon: 'fa-microchip', color: 'text-indigo-400' },
      { label: 'Max Speed', value: bestWpm+' WPM', icon: 'fa-bolt', color: 'text-cyan-400' },
      { label: 'Precision', value: avgAcc+'%', icon: 'fa-crosshairs', color: 'text-emerald-400' },
      { label: 'Deployments', value: state.history.length, icon: 'fa-server', color: 'text-fuchsia-400' }
    ];

    document.getElementById('topStatsBar').innerHTML = stats.map(function(s) {
      return '<div class="glass-panel p-4 flex items-center gap-4 border-none bg-slate-800/40 hover:bg-slate-800/60 transition-colors">' +
             '<div class="text-2xl '+s.color+'"><i class="fa-solid '+s.icon+'"></i></div>' +
             '<div><div class="text-[10px] text-slate-400 font-mono uppercase tracking-widest">'+s.label+'</div>' +
             '<div class="text-xl font-bold font-mono text-white">'+s.value+'</div></div></div>';
    }).join('');
  }

  function renderApp() { renderTopStats(); if(currentView === 'dashboard') { renderDashboard(); } else if (currentView === 'chapter' && selectedChapterId) { renderChapterDetail(); } }

  function renderDashboard(){
    var html = '<div class="p-6 h-full flex flex-col min-h-0">';
    html += '<div class="flex justify-between items-end mb-6">';
    html += '<div><h2 class="text-2xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-folder-tree text-cyan-500"></i> Training Directories</h2><p class="text-sm text-slate-400 mt-1 font-mono">Select a target module to initiate sequence.</p></div></div>';

    html += '<div class="flex-1 flex flex-col min-h-0 rounded-xl overflow-hidden border border-slate-700/50 bg-slate-900/50">';
    html += '<div class="flex bg-slate-800/80 p-4 text-xs font-mono font-bold text-slate-400 uppercase tracking-widest border-b border-slate-700/50">';
    html += '<div class="w-16 text-center">Sys</div><div class="flex-1">Module_Name</div><div class="w-32 text-center">Peak_WPM</div><div class="w-32 text-center">Accuracy</div><div class="w-32 text-center">Action</div></div>';
    
    html += '<div class="overflow-y-auto flex-1 p-2 space-y-1">';
    CHAPTERS.forEach(function(c){
      var unlocked = isUnlocked(c.id); var done = state.completed[c.id];
      var icon = !unlocked ? '<i class="fa-solid fa-lock text-slate-600"></i>' : (done ? '<i class="fa-solid fa-check-circle text-emerald-500"></i>' : '<i class="fa-regular fa-circle-play text-cyan-400"></i>');
      
      html += '<div class="flex items-center p-3 text-sm chapter-row rounded-lg '+(unlocked ? '' : 'opacity-50 grayscale')+'">';
      html += '<div class="w-16 text-center text-xl">'+icon+'</div>';
      html += '<div class="flex-1 font-bold text-slate-200">['+c.id+'] '+escapeHtml(c.title)+'</div>';
      html += '<div class="w-32 text-center font-mono text-cyan-300">'+(done?done.bestWpm:'--')+'</div>';
      html += '<div class="w-32 text-center font-mono text-emerald-400">'+(done?done.bestAccuracy+'%':'--')+'</div>';
      html += '<div class="w-32 text-center">';
      if(unlocked){ html += '<button onclick="window.selectChapter('+c.id+')" class="btn-advanced w-full !py-1.5 text-xs"><i class="fa-solid fa-terminal mr-1"></i> INIT</button>'; } 
      else { html += '<button disabled class="btn-advanced w-full !py-1.5 text-xs opacity-50"><i class="fa-solid fa-ban"></i></button>'; }
      html += '</div></div>';
    });
    html += '</div></div></div>';
    document.getElementById('mainPanel').innerHTML = html;
  }

  window.selectChapter = function(id) { selectedChapterId = id; currentView = 'chapter'; renderApp(); };

  function renderChapterDetail(){
    var c = CHAPTERS.find(function(x){ return x.id===selectedChapterId; });
    if(!c) { currentView = 'dashboard'; renderApp(); return; }
    var done = state.completed[c.id];

    var html = '<div class="p-6 h-full flex flex-col min-h-0">';
    
    html += '<div class="flex items-center gap-4 mb-6 pb-6 border-b border-slate-700/50">';
    html += '<button onclick="window.goBack()" class="btn-advanced text-xs"><i class="fa-solid fa-chevron-left mr-1"></i> Return</button>';
    html += '<div><h2 class="text-2xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-terminal text-cyan-400"></i> '+escapeHtml(c.title)+'</h2><p class="text-xs text-slate-400 mt-1 font-mono">Module Configuration</p></div></div>';

    html += '<div class="flex flex-col lg:flex-row gap-6 flex-1 min-h-0">';
    html += '<div class="flex-1 flex flex-col gap-6 min-w-0">';
      
      html += '<div class="glass-panel flex flex-col flex-1 min-h-[200px] border-slate-700/50 overflow-hidden">';
      html += '<div class="bg-slate-800/80 px-4 py-2 text-xs font-mono font-bold text-slate-400 flex justify-between border-b border-slate-700/50"><span>Target_String.txt</span> <span>Length: '+wordCount(c.text)+' words</span></div>';
      html += '<div class="p-6 font-mono text-[15px] leading-relaxed text-slate-300 overflow-y-auto flex-1 select-none bg-[#0B1120]">'+escapeHtml(c.text)+'</div></div>';
      
      html += '<div class="glass-panel p-6 border-slate-700/50 flex-shrink-0">';
      html += '<div class="text-sm font-mono font-bold text-cyan-400 mb-4">Set_Parameters (Timer)</div>';
      html += '<div class="flex flex-wrap gap-3 mb-6">';
      [30, 60, 120, 'sudden'].forEach(function(d){
        var active = state.settings.timerDuration === d;
        var label = d==='sudden' ? '<i class="fa-solid fa-skull text-red-500"></i> Death' : d+'s';
        html += '<button onclick="window.setDuration(\''+d+'\')" class="btn-advanced timer-btn font-mono '+(active?'active':'')+'">'+label+'</button>';
      });
      html += '</div>';
      html += '<button onclick="window.startCurrentDrill()" class="btn-advanced btn-primary-glow w-full py-4 text-lg font-bold font-mono tracking-widest"><i class="fa-solid fa-play mr-2"></i> EXECUTE_DRILL()</button>';
      html += '</div></div>';

    html += '<div class="w-full lg:w-[350px] flex flex-col gap-6 flex-shrink-0">';
      if(done){
        html += '<div class="glass-panel p-5 border-slate-700/50">';
        html += '<div class="text-xs font-mono font-bold text-slate-400 uppercase mb-4">Highest_Metrics</div>';
        html += '<div class="grid grid-cols-2 gap-4">';
        html += '<div class="bg-slate-900/80 border border-slate-700/50 p-4 rounded-xl text-center"><div class="text-3xl font-black font-mono text-cyan-400">'+done.bestWpm+'</div><div class="text-[10px] uppercase font-bold text-slate-500 mt-1">WPM</div></div>';
        html += '<div class="bg-slate-900/80 border border-slate-700/50 p-4 rounded-xl text-center"><div class="text-3xl font-black font-mono text-emerald-400">'+done.bestAccuracy+'%</div><div class="text-[10px] uppercase font-bold text-slate-500 mt-1">Accuracy</div></div>';
        html += '</div></div>';
      }
      html += '<div class="glass-panel p-5 flex flex-col flex-1 min-h-[250px] border-slate-700/50">';
      html += '<div class="text-xs font-mono font-bold text-slate-400 uppercase mb-4">System_Logs (Recent)</div>';
      html += '<div class="overflow-y-auto flex-1 pr-2 space-y-3">';
      var recent = state.history.filter(function(h){ return h.chapterId === c.id; }).slice(-8).reverse();
      if(recent.length === 0){ html += '<div class="text-center text-slate-500 text-sm mt-8 font-mono italic">No logs found.</div>'; } 
      else {
        recent.forEach(function(h){
          var date = new Date(h.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
          html += '<div class="bg-slate-800/40 border border-slate-700/50 p-3 rounded-lg hover:bg-slate-800/80 transition-colors">';
          html += '<div class="flex justify-between text-[10px] font-mono text-slate-400 mb-2"><span>['+date+']</span> <span class="px-2 rounded '+(h.completed?'bg-emerald-500/20 text-emerald-400':'bg-red-500/20 text-red-400')+'">'+(h.completed?'SUCCESS':'FAILED')+'</span></div>';
          html += '<div class="flex justify-between font-mono text-sm font-bold"><span><span class="text-slate-500">SPD:</span> <span class="text-cyan-400">'+h.wpm+'</span></span> <span><span class="text-slate-500">ACC:</span> <span class="text-emerald-400">'+h.accuracy+'%</span></span></div>';
          html += '</div>';
        });
      }
      html += '</div></div></div></div></div>';
    document.getElementById('mainPanel').innerHTML = html;
  }

  window.goBack = function() { currentView = 'dashboard'; selectedChapterId = null; renderApp(); };
  window.setDuration = function(val) { state.settings.timerDuration = (val==='sudden') ? 'sudden' : parseInt(val,10); saveState(); renderApp(); };
  window.startCurrentDrill = function() { openTypingSession(selectedChapterId); };

  /* ===================== Popup Cyberpunk CSS ===================== */
  var POPUP_CSS = ':root { --bg: #0B1120; --panel: #1E293B; --border: #334155; --text: #F8FAFC; --muted: #94A3B8; --cyan: #06B6D4; --green: #10B981; --red: #EF4444; } *{box-sizing:border-box;margin:0;padding:0;} html,body{height:100%;} body{background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;display:flex;flex-direction:column;} .font-mono{font-family:"Fira Code",monospace;} #root{flex:1;display:flex;flex-direction:column;height:100%;padding:24px;} .wrap{flex:1;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 0 40px rgba(0,0,0,0.5);max-width:1200px;margin:0 auto;width:100%;overflow:hidden;} .topbar{background:rgba(15,23,42,0.8);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);} .chapter-name{font-size:18px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;} .mode-badge{font-size:11px;font-family:"Fira Code",monospace;padding:6px 12px;background:rgba(6,182,212,0.1);color:var(--cyan);border:1px solid rgba(6,182,212,0.3);border-radius:6px;text-transform:uppercase;} .stats-row{display:grid;grid-template-columns:repeat(5,1fr);background:rgba(15,23,42,0.4);border-bottom:1px solid var(--border);} .stat{padding:16px;text-align:center;border-right:1px solid var(--border);} .stat:last-child{border-right:none;} .stat-val{font-size:32px;font-weight:800;font-family:"Fira Code",monospace;color:var(--text);} .stat-label{font-size:10px;color:var(--muted);margin-top:6px;text-transform:uppercase;font-weight:700;letter-spacing:1px;font-family:"Fira Code",monospace;} .text-stage{flex:1;padding:40px;font-size:28px;line-height:1.6;white-space:pre-wrap;word-break:break-word;overflow-y:auto;font-family:"Fira Code",monospace;background:#0F172A;} .text-stage span.pending{color:var(--muted);opacity:0.5;} .text-stage span.correct{color:var(--text);font-weight:700;} .text-stage span.incorrect{color:white;background:var(--red);border-radius:4px;padding:0 2px;} .text-stage span.current{border-bottom:3px solid var(--cyan);color:var(--cyan);text-shadow:0 0 10px rgba(6,182,212,0.5);background:rgba(6,182,212,0.1);} .hint{text-align:center;font-size:12px;color:var(--muted);padding:12px;background:var(--panel);border-top:1px solid var(--border);font-family:"Fira Code",monospace;} .hidden-input{position:absolute;opacity:0;height:1px;width:1px;pointer-events:none;} .summary-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;gap:24px;text-align:center;overflow-y:auto;background:var(--bg);} .summary-title{font-size:36px;font-weight:800;font-family:"Fira Code",monospace;text-transform:uppercase;letter-spacing:2px;} .summary-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;width:100%;max-width:800px;margin-top:20px;} .stat-box{border:1px solid var(--border);padding:24px;background:var(--panel);border-radius:12px;} .btn-row{display:flex;gap:20px;margin-top:32px;} .btn{padding:14px 32px;font-size:14px;font-family:"Fira Code",monospace;font-weight:700;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);transition:all 0.2s;} .btn:hover{background:#334155;} .btn-accent{background:linear-gradient(135deg,var(--cyan),#3B82F6);color:white;border:none;box-shadow:0 0 20px rgba(6,182,212,0.4);} .btn-accent:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(6,182,212,0.6);}';

  function popupMain(CONFIG){
    var text = CONFIG.text; var duration = CONFIG.duration; var soundOn = CONFIG.soundEnabled; var chapterId = CONFIG.chapterId; var chapterTitle = CONFIG.chapterTitle;
    var typed = ''; var totalKeystrokes = 0; var errorCount = 0; var startTime = null; var ended = false; var timerInterval = null; var elapsedSeconds = 0; var timeLeft = (typeof duration === 'number') ? duration : 0; var wpmHistory = []; var audioCtx = null; var charSpans = null; var root = document.getElementById('root');
    function escapeChar(ch){ var map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}; return map[ch] || ch; }
    function buildCharSpans(){ var html = ''; for(var i=0;i<text.length;i++){ html += '<span class="pending" data-i="'+i+'">'+escapeChar(text[i])+'</span>'; } document.getElementById('textStage').innerHTML = html; charSpans = document.getElementById('textStage').querySelectorAll('span'); }
    function renderShell(){
      root.innerHTML = '<div class="wrap"><div class="topbar"><div class="chapter-name"><i class="fa-solid fa-terminal text-cyan-400"></i> '+chapterTitle+'</div><div class="mode-badge">'+(duration==='sudden' ? 'Sudden Death' : duration+'s Timer')+'</div></div><div class="stats-row"><div class="stat"><div class="stat-val" id="statTime" style="color:var(--cyan);">'+(duration==='sudden'?'0s':duration+'s')+'</div><div class="stat-label">'+(duration==='sudden'?'ELAPSED':'TIME_LEFT')+'</div></div><div class="stat"><div class="stat-val" id="statWpm">0</div><div class="stat-label">WPM_LIVE</div></div><div class="stat"><div class="stat-val" id="statNet">0</div><div class="stat-label">NET_SPEED</div></div><div class="stat"><div class="stat-val" id="statAcc" style="color:var(--green);">100%</div><div class="stat-label">ACCURACY</div></div><div class="stat"><div class="stat-val" id="statErr" style="color:var(--red);">0</div><div class="stat-label">ERRORS</div></div></div><div class="text-stage" id="textStage" aria-live="polite"></div><div class="hint">AWAITING_INPUT... [TYPE TO START] | [ESC] ABORT</div><input id="hiddenInput" class="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" /></div>';
      buildCharSpans(); if(charSpans.length){ charSpans[0].classList.add('current'); }
      var inp = document.getElementById('hiddenInput'); inp.value = ''; inp.addEventListener('input', onInput); inp.focus(); root.addEventListener('click', function(){ if(!ended) inp.focus(); });
    }
    function renderChars(){
      for(var i=0;i<charSpans.length;i++){ var span = charSpans[i]; if(i < typed.length){ span.className = (typed[i]===text[i]) ? 'correct' : 'incorrect'; } else { span.className = 'pending'; } }
      if(typed.length < charSpans.length){ charSpans[typed.length].classList.add('current'); }
    }
    function computeStats(){
      if(elapsedSeconds===0){ return {wpm:0, net:0, acc:totalKeystrokes>0 ? Math.round(((totalKeystrokes-errorCount)/totalKeystrokes)*100) : 100}; }
      var mins = elapsedSeconds/60; var wpm = Math.max(0, Math.round((typed.length/5)/mins)); var net = Math.max(0, Math.round(((typed.length/5)-errorCount)/mins)); var acc = totalKeystrokes>0 ? Math.round(((totalKeystrokes-errorCount)/totalKeystrokes)*100) : 100; return {wpm:wpm, net:net, acc:acc};
    }
    function refreshStatsUI(){
      var s = computeStats(); document.getElementById('statWpm').textContent = s.wpm; document.getElementById('statNet').textContent = s.net; document.getElementById('statAcc').textContent = s.acc+'%'; document.getElementById('statErr').textContent = errorCount; document.getElementById('statTime').textContent = duration==='sudden' ? (elapsedSeconds+'s') : (timeLeft+'s');
    }
    function playClick(){ if(!soundOn) return; try{ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); var o = audioCtx.createOscillator(); var g = audioCtx.createGain(); o.type = 'sine'; o.frequency.value = 1200; g.gain.setValueAtTime(0.02, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.05); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.05); }catch(e){} }
    function playError(){ if(!soundOn) return; try{ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); var o = audioCtx.createOscillator(); var g = audioCtx.createGain(); o.type = 'square'; o.frequency.setValueAtTime(150, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime+0.2); g.gain.setValueAtTime(0.05, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.2); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.2); }catch(e){} }
    function startTimer(){ timerInterval = setInterval(function(){ if(ended) return; elapsedSeconds++; if(duration!=='sudden'){ timeLeft = duration - elapsedSeconds; if(timeLeft<=0){ timeLeft = 0; refreshStatsUI(); wpmHistory.push({t:elapsedSeconds, wpm:computeStats().wpm}); endSession(typed.length>=text.length); return; } } refreshStatsUI(); wpmHistory.push({t:elapsedSeconds, wpm:computeStats().wpm}); try{ if(window.opener && !window.opener.closed && window.opener.__typingApp){ window.opener.__typingApp.receiveLiveUpdate({ chapterId: chapterId, wpm: computeStats().wpm, accuracy: computeStats().acc, errors: errorCount, timeLeft: (duration==='sudden' ? null : timeLeft), elapsed: elapsedSeconds }); } }catch(e){} }, 1000); }
    function onInput(){
      if(ended) return; var inp = document.getElementById('hiddenInput'); var newVal = inp.value; if(newVal.length > text.length) newVal = newVal.slice(0, text.length); if(startTime===null && newVal.length>0){ startTime = Date.now(); startTimer(); }
      if(newVal.length > typed.length){ for(var i=typed.length; i<newVal.length; i++){ totalKeystrokes++; var correct = newVal[i]===text[i]; if(correct){ playClick(); } else{ errorCount++; playError(); if(duration==='sudden'){ typed = newVal.slice(0,i+1); inp.value = typed; renderChars(); refreshStatsUI(); endSession(false); return; } } } }
      typed = newVal; inp.value = typed; renderChars(); refreshStatsUI(); if(typed.length >= text.length){ endSession(true); }
    }
    function endSession(completed){
      if(ended) return; ended = true; if(timerInterval) clearInterval(timerInterval); var s = computeStats(); var result = { chapterId: chapterId, chapterTitle: chapterTitle, wpm: s.wpm, netWpm: s.net, accuracy: s.acc, errors: errorCount, completed: completed, duration: Math.max(elapsedSeconds,1), mode: (duration==='sudden') ? 'sudden' : (duration+'s'), timestamp: Date.now() };
      try{ if(window.opener && !window.opener.closed && window.opener.__typingApp){ window.opener.__typingApp.receiveSessionResult(result); } }catch(e){} renderSummary(result);
    }
    function renderSummary(result){
      var success = result.completed; var titleText = success ? 'EXECUTION_SUCCESS' : (duration==='sudden' ? 'FATAL_ERROR: SUDDEN DEATH' : "TIME_EXPIRED");
      root.innerHTML = '<div class="wrap"><div class="topbar"><div><i class="fa-solid fa-file-code text-cyan-400"></i> SYSTEM_REPORT</div></div><div class="summary-wrap"><div style="font-size:72px; color:var('+(success?'--green':'--red')+'); text-shadow: 0 0 30px '+(success?'rgba(16,185,129,0.4)':'rgba(239,68,68,0.4)')+';"><i class="fa-solid '+(success?'fa-shield-check':'fa-triangle-exclamation')+'"></i></div><div class="summary-title" style="color:var('+(success?'--cyan':'--red')+');">'+titleText+'</div><div class="summary-stats"><div class="stat-box"><div class="stat-val text-cyan-400">'+result.wpm+'</div><div class="stat-label">GROSS_WPM</div></div><div class="stat-box"><div class="stat-val text-blue-400">'+result.netWpm+'</div><div class="stat-label">NET_WPM</div></div><div class="stat-box"><div class="stat-val text-green-400">'+result.accuracy+'%</div><div class="stat-label">ACCURACY</div></div><div class="stat-box"><div class="stat-val text-red-400">'+result.errors+'</div><div class="stat-label">ERRORS</div></div></div><div class="btn-row"><button id="retryBtn" class="btn"><i class="fa-solid fa-rotate-right"></i> REBOOT_MODULE</button><button id="closeBtn" class="btn btn-accent"><i class="fa-solid fa-xmark"></i> CLOSE_TERMINAL</button></div></div></div>';
      var fa = document.createElement('link'); fa.rel='stylesheet'; fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css'; document.head.appendChild(fa);
      document.getElementById('retryBtn').addEventListener('click', resetAndRestart); document.getElementById('closeBtn').addEventListener('click', function(){ window.close(); });
    }
    function resetAndRestart(){ typed=''; totalKeystrokes=0; errorCount=0; startTime=null; ended=false; elapsedSeconds=0; timeLeft=(typeof duration==='number')?duration:0; wpmHistory=[]; if(timerInterval) clearInterval(timerInterval); renderShell(); }
    document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(ended || confirm('Abort execution? Progress will be lost.')){ window.close(); } } });
    renderShell();
  }

  function openTypingSession(chapterId){
    if(activePopup && !activePopup.closed){ activePopup.focus(); return; }
    var chapter = CHAPTERS.find(function(c){ return c.id===chapterId; }); if(!chapter) return;
    var popup = window.open('', 'TypingWorld_Advanced', 'width=1100,height=750,resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no');
    if(!popup){ alert('Please allow pop-ups to launch the terminal.'); return; }
    var shellHtml = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>'+escapeHtml(chapter.title)+' - Terminal</title><link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@400;700;800&display=swap" rel="stylesheet"><style>'+POPUP_CSS+'</style></head><body><div id="root"></div></body></html>';
    popup.document.open(); popup.document.write(shellHtml); popup.document.close();
    var cfg = { chapterId: chapter.id, chapterTitle: chapter.title, text: chapter.text, duration: state.settings.timerDuration, soundEnabled: state.settings.soundEnabled };
    var scriptEl = popup.document.createElement('script'); scriptEl.textContent = '(' + popupMain.toString() + ')(' + JSON.stringify(cfg) + ');'; popup.document.body.appendChild(scriptEl);
    activePopup = popup; watchPopup();
  }

  function watchPopup(){
    if(popupWatcherInterval) clearInterval(popupWatcherInterval);
    popupWatcherInterval = setInterval(function(){ if(activePopup && activePopup.closed){ clearInterval(popupWatcherInterval); activePopup = null; } }, 800);
  }

  window.__typingApp = {
    receiveLiveUpdate: function(data){ },
    receiveSessionResult: function(result){
      state.history.push(result); if(state.history.length>200) state.history = state.history.slice(-200);
      if(result.completed){
        var prev = state.completed[result.chapterId];
        state.completed[result.chapterId] = {
          bestWpm: prev ? Math.max(prev.bestWpm, result.wpm) : result.wpm, bestNet: prev ? Math.max(prev.bestNet, result.netWpm) : result.netWpm,
          bestAccuracy: prev ? Math.max(prev.bestAccuracy, result.accuracy) : result.accuracy, attempts: prev ? prev.attempts+1 : 1, completedAt: result.timestamp
        };
      } saveState(); renderApp(); 
    }
  };

  function loadChaptersFromSheet() {
    Papa.parse(SHEET_CSV_URL, {
      download: true, header: true, skipEmptyLines: true,
      complete: function(results) {
        CHAPTERS = results.data.map(function(row) { return { id: parseInt(row.id, 10) || 0, title: row.title || 'Untitled', text: row.text || '' }; });
        if (CHAPTERS.length > 0) { init(); } else { document.getElementById('mainPanel').innerHTML = '<div class="p-10 text-center text-red-500 font-bold"><i class="fa-solid fa-triangle-exclamation text-4xl mb-4"></i><h2 class="text-xl font-mono">ERROR: 0 MODULES DETECTED</h2></div>'; }
      },
      error: function(error) { document.getElementById('mainPanel').innerHTML = '<div class="p-10 text-center text-red-500 font-bold"><i class="fa-solid fa-plug-circle-xmark text-4xl mb-4"></i><h2 class="text-xl font-mono">CONNECTION FAILED</h2><p class="text-slate-400 font-mono">Check CSV configuration.</p></div>'; }
    });
  }

  function init(){ applySoundIcon(); renderApp(); document.getElementById('soundToggle').addEventListener('click', function(){ state.settings.soundEnabled = !state.settings.soundEnabled; saveState(); applySoundIcon(); }); document.getElementById('resetBtn').addEventListener('click', function(){ if(confirm('WARNING: This will wipe all system logs and metrics. Proceed?')){ state = defaultState(); saveState(); currentView = 'dashboard'; renderApp(); } }); }
  
  loadChaptersFromSheet();
})();
</script>
